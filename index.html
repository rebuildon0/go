<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TOOLBOX</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem 1.25rem; line-height: 1.6; color: #222; }
  a { display: block; margin: .5rem 0; padding: .75rem 1rem; border: 1px solid #ccc; border-radius: .5rem; text-decoration: none; color: #0645ad; word-break: break-all; }
  .muted { color: #666; font-size: .9rem; }
</style>
</head>
<body>
<p id="msg">接続先を確認しています…</p>
<div id="links"></div>
<script>
// New links use #pc-yoga:/notes/foo/bar.html (or pc-tec). The publisher verified that PC's content.
// Keep legacy #/notes/... links working. The fragment is never sent to GitHub.
const names = ['pc-yoga', 'pc-tec'];
const base = name => 'https://' + name + '.tail22bf94.ts.net';
const fragment = location.hash.slice(1) || '/';
const preferred = fragment.match(/^(pc-yoga|pc-tec):(\/.*)$/);
const path = (preferred ? preferred[2] : fragment).replace(/^(?!\/)/, '/');
const hosts = preferred ? [base(preferred[1])] : names.map(base);

function probe(base) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 2500);
  // Reachability only: opaque responses cannot prove status/version. publish.mjs checks the full HTTPS body.
  return fetch(base + path + (path.includes('?') ? '&' : '?') + 'ping=' + Date.now(), { method: 'HEAD', mode: 'no-cors', cache: 'no-store', signal: ctrl.signal })
    .then(() => base)
    .finally(() => clearTimeout(timer));
}

function showFailure() {
  const message = document.getElementById('msg');
  message.textContent = preferred ? '配信元PCに接続できませんでした。PCの稼働とスマホのTailscale接続を確認してください。' : 'どちらのPCにも接続できませんでした。スマホのTailscale接続を確認してください。';
  const links = document.getElementById('links');
  for (const name of names) {
    const link = document.createElement('a');
    link.href = base(name) + path;
    link.textContent = name + (preferred && name !== preferred[1] ? ' を開く（更新未確認・保存回答は別）' : ' を直接開く');
    links.append(link);
  }
  // Do not automatically fall back from a verified PC to a potentially stale peer.
}
let safe = false;
try { safe = path.startsWith('/') && !path.startsWith('//') && !decodeURIComponent(path).includes('\\') && !decodeURIComponent(path).split(/[/?#]/).includes('..') && !/^[^/]+:/.test(fragment.replace(/^(pc-yoga|pc-tec):/, '')); } catch {}
if (!safe) document.getElementById('msg').textContent = '配信パスを確認してください。';
else Promise.any(hosts.map(probe))
  .then(base => location.replace(base + path))
  .catch(showFailure);
</script>
</body>
</html>
