<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TOOLBOX</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem 1.25rem; line-height: 1.6; color: #222; }
  a { display: block; margin: .5rem 0; padding: .75rem 1rem; border: 1px solid #ccc; border-radius: .5rem; text-decoration: none; color: #0645ad; word-break: break-all; }
  .muted { color: #666; font-size: .9rem; }
</style>
</head>
<body>
<p id="msg">接続先を確認しています…</p>
<div id="links"></div>
<script>
// Both PCs serve the same TOOLBOX (shared through Google Drive). Ask both and go to whichever answers first.
// Usage: https://<this page>/#/notes/foo/bar.html  (the part after # is the path on TOOLBOX; it is never sent to GitHub)
const hosts = ['pc-yoga', 'pc-tec'].map(h => 'https://' + h + '.tail22bf94.ts.net');
const path = (location.hash.slice(1) || '/').replace(/^(?!\/)/, '/');

function probe(base) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 5000);
  // no-cors: an opaque response is enough to know the server is reachable.
  return fetch(base + '/index.html?ping=' + Date.now(), { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal })
    .then(() => base)
    .finally(() => clearTimeout(timer));
}

Promise.any(hosts.map(probe))
  .then(base => location.replace(base + path))
  .catch(() => {
    document.getElementById('msg').innerHTML =
      'どちらのPCにも接続できませんでした。<br><span class="muted">スマホの Tailscale がオンか確認してください。下のリンクを直接開くこともできます。</span>';
    document.getElementById('links').innerHTML = hosts.map(b => '<a href="' + b + path + '">' + b + path + '</a>').join('');
  });
</script>
</body>
</html>
